<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POKEE</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22252f; --border: #2a2d38;
    --text: #e4e6ed; --text2: #9ca0b0; --accent: #6c8aff; --accent2: #5b7af0;
    --green: #4ade80; --yellow: #fbbf24; --red: #f87171;
    --radius: 10px; --radius-sm: 6px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  }

  /* ── Auth page ── */
  .auth-container {
    display: flex; align-items: center; justify-content: center; height: 100vh;
  }
  .auth-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 40px 36px; width: 380px; max-width: 90vw;
  }
  .auth-box h1 {
    font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 4px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .auth-box .sub { text-align: center; font-size: 13px; color: var(--text2); margin-bottom: 24px; }
  .auth-tabs { display: flex; margin-bottom: 24px; border-radius: var(--radius-sm); overflow: hidden; }
  .auth-tabs button {
    flex: 1; padding: 10px; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text2); cursor: pointer; font-size: 14px; transition: all 0.2s;
  }
  .auth-tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .auth-field { margin-bottom: 16px; }
  .auth-field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .auth-field input {
    width: 100%; padding: 12px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-size: 14px; outline: none;
    transition: border-color 0.2s;
  }
  .auth-field input:focus { border-color: var(--accent); }
  .auth-box .btn {
    width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer;
    transition: background 0.2s; margin-top: 8px;
  }
  .auth-box .btn:hover { background: var(--accent2); }
  .auth-box .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth-error { color: var(--red); font-size: 12px; text-align: center; margin-top: 12px; min-height: 18px; }
  .auth-box .logout-hint { text-align: center; font-size: 11px; color: var(--text2); margin-top: 16px; cursor: pointer; }

  /* ── Chat layout ── */
  .app { display: none; height: 100vh; }
  .app.active { display: flex; }
  .sidebar {
    width: 320px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 {
    font-size: 18px; font-weight: 600;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sidebar-header .user-info { font-size: 12px; color: var(--text2); margin-top: 4px; }
  /* ── Platform status ── */
  .platform-status {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .platform-status .ps-title {
    color: var(--text2); text-transform: uppercase; letter-spacing: 1px;
    font-size: 10px; margin-bottom: 8px;
  }
  .platform-row {
    display: flex; align-items: center; gap: 8px; padding: 4px 0;
    cursor: default;
  }
  .platform-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    background: #4a4d5a; transition: background 0.3s;
  }
  .platform-dot.online { background: var(--green); }
  .platform-row .ps-label { color: var(--text2); flex: 1; }
  .platform-row:hover .ps-label { color: var(--text); }
  .platform-row .ps-hint {
    display: none; font-size: 10px; color: var(--text2); white-space: nowrap;
  }
  .platform-row:hover .ps-hint { display: inline; }
  .platform-row .ps-connect {
    display: none; font-size: 11px; color: var(--accent); cursor: pointer;
    white-space: nowrap; padding: 1px 6px; border: 1px solid var(--accent);
    border-radius: 3px; transition: all 0.2s;
  }
  .platform-row .ps-connect:hover { background: var(--accent); color: #fff; }
  .platform-row .ps-connect.show { display: inline; }
  /* QR Modal */
  .qr-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 100; align-items: center; justify-content: center;
  }
  .qr-overlay.active { display: flex; }
  .qr-modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 32px; text-align: center; width: 340px; max-width: 90vw;
  }
  .qr-modal h3 { font-size: 16px; margin-bottom: 4px; }
  .qr-modal .qr-sub { font-size: 12px; color: var(--text2); margin-bottom: 20px; }
  .qr-modal .qr-img { margin: 0 auto 16px; width: 220px; height: 220px; }
  .qr-modal .qr-img img { width: 100%; height: 100%; }
  .qr-modal .qr-success-text { display: none; color: var(--green); font-size: 14px; margin: 20px 0; }
  .qr-modal .qr-close {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
    padding: 8px 24px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
  }
  .qr-modal .qr-close:hover { border-color: var(--accent); color: var(--accent); }
  .wa-tabs { display: flex; justify-content: center; gap: 0; margin-bottom: 16px; }
  .wa-tab {
    padding: 6px 20px; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text2); cursor: pointer; font-size: 12px; transition: all .15s;
  }
  .wa-tab:first-child { border-radius: 6px 0 0 6px; }
  .wa-tab:last-child { border-radius: 0 6px 6px 0; }
  .wa-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .wa-tab-panel { display: none; }
  .wa-tab-panel.active { display: block; }

  .reminder-list { flex: 1; overflow-y: auto; padding: 12px; }
  .reminder-list::-webkit-scrollbar { width: 4px; }
  .reminder-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .reminder-card {
    background: var(--surface2); border-radius: var(--radius-sm); padding: 12px;
    margin-bottom: 8px; border-left: 3px solid var(--accent); font-size: 13px;
  }
  .reminder-card.sent { border-left-color: var(--green); opacity: 0.7; }
  .reminder-card.cancelled { border-left-color: var(--red); opacity: 0.5; text-decoration: line-through; }
  .reminder-card .task { font-weight: 500; margin-bottom: 4px; }
  .reminder-card .meta { font-size: 11px; color: var(--text2); }
  .section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text2);
    padding: 8px 4px; margin-top: 4px;
  }
  .empty-state { text-align: center; padding: 40px 16px; color: var(--text2); font-size: 13px; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .chat-header .status { font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .chat-header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .chat-header button {
    background: transparent; border: 1px solid var(--border); color: var(--text2);
    padding: 6px 14px; border-radius: var(--radius-sm); cursor: pointer; font-size: 12px;
    margin-left: 8px; transition: all 0.2s;
  }
  .chat-header button:hover { border-color: var(--accent); color: var(--accent); }
  .chat-header button.danger:hover { border-color: var(--red); color: var(--red); }
  .messages {
    flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .msg { display: flex; gap: 10px; max-width: 80%; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }
  .msg.system { align-self: center; max-width: 90%; }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
  }
  .msg.user .msg-avatar { background: var(--accent); }
  .msg.assistant .msg-avatar { background: linear-gradient(135deg, #6c8aff, #a78bfa); }
  .msg-bubble {
    padding: 12px 16px; border-radius: var(--radius); font-size: 14px;
    line-height: 1.6; word-break: break-word;
  }
  .msg.user .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
  .msg.assistant .msg-bubble { background: var(--surface2); border-bottom-left-radius: 2px; }
  .msg.system .msg-bubble {
    background: transparent; border: 1px dashed var(--border);
    padding: 10px 20px; font-size: 13px; color: var(--yellow); text-align: center;
  }
  .typing { align-self: flex-start; padding-left: 42px; }
  .typing .dots { display: flex; gap: 4px; }
  .typing .dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text2);
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing .dots span:nth-child(1) { animation-delay: -0.32s; }
  .typing .dots span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }

  .input-area { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .input-area input {
    flex: 1; padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: 14px; outline: none;
  }
  .input-area input:focus { border-color: var(--accent); }
  .input-area input::placeholder { color: #4a4d5a; }
  .input-area button {
    padding: 12px 24px; background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .input-area button:hover { background: var(--accent2); }
  .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .msg { max-width: 90%; }
    .messages { padding: 16px; }
    .input-area { padding: 12px 16px; }
  }
</style>
</head>
<body>

<!-- ── Auth page ── -->
<div id="authPage" class="auth-container">
  <div class="auth-box">
    <h1>POKEE</h1>
    <p class="sub">Your Personal Reminder</p>
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
      <button id="tabRegister" onclick="switchTab('register')">注册</button>
    </div>
    <div class="auth-field">
      <label>邮箱</label>
      <input type="email" id="authEmail" placeholder="example@mail.com" autofocus>
    </div>
    <div class="auth-field">
      <label>密码（至少6位）</label>
      <input type="password" id="authPassword" placeholder="••••••" onkeydown="if(event.key==='Enter') doAuth()">
    </div>
    <button class="btn" id="authBtn" onclick="doAuth()">登录</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<!-- ── Chat app ── -->
<div id="app" class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>POKEE</h1>
      <p class="sub" style="font-size:11px;color:var(--text2);margin-top:2px">Your Personal Reminder</p>
      <p class="user-info" id="sidebarUser"></p>
    </div>
    <div class="platform-status" id="platformStatus">
      <div class="ps-title">平台连接</div>
      <div id="platformList"></div>
    </div>
    <div class="reminder-list" id="reminderList">
      <div class="empty-state">加载中...</div>
    </div>
  </aside>
  <main class="main">
    <div class="chat-header">
      <div class="status"><span class="dot"></span>在线</div>
      <div>
        <button onclick="resetSession()">新会话</button>
        <button class="danger" onclick="logout()">退出登录</button>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="msg assistant">
        <div class="msg-avatar">🤖</div>
        <div class="msg-bubble">
          你好！我是提醒助手 ⏰<br>
          比如你可以说："明天下午3点提醒我开会"、"10分钟后提醒我看邮件"
        </div>
      </div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="输入提醒内容..." autofocus
             onkeydown="if(event.key==='Enter') sendMessage()">
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </main>
</div>

<!-- ── QR 弹窗 ── -->
<div class="qr-overlay" id="qrOverlay">
  <div class="qr-modal">
    <h3 id="qrTitle">连接平台</h3>
    <p class="qr-sub" id="qrSub"></p>
    <div class="wa-tabs" id="waTabs" style="display:none">
      <button class="wa-tab active" onclick="switchWaTab('qr')" id="waTabQr">扫码连接</button>
      <button class="wa-tab" onclick="switchWaTab('pairing')" id="waTabPairing">配对码连接</button>
    </div>
    <div class="wa-tab-panel active" id="waPanelQr">
      <div class="qr-img" id="qrContainer"></div>
    </div>
    <div class="wa-tab-panel" id="waPanelPairing">
      <div id="pairingCodeDisplay" style="text-align:center;display:none"></div>
      <div id="pairingInput" style="margin:12px 0">
        <div style="display:flex;gap:8px">
          <select id="waCountry" style="width:140px;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">
            <option value="86">🇨🇳 +86</option>
            <option value="852">🇭🇰 +852</option>
            <option value="886">🇼🇸 +886</option>
            <option value="1">🇺🇲 +1</option>
            <option value="44">🇬🇧 +44</option>
            <option value="81">🇯🇵 +81</option>
            <option value="65">🇸🇬 +65</option>
            <option value="60">🇲🇾 +60</option>
            <option value="other">其他</option>
          </select>
          <input type="tel" id="waPhone" placeholder="手机号"
            style="flex:1;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;text-align:center">
        </div>
        <button onclick="requestPairing()" id="pairingBtn"
          style="width:100%;margin-top:8px;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer">
          获取配对码
        </button>
        <div id="pairingError" style="color:var(--red);font-size:11px;margin-top:6px;min-height:16px"></div>
      </div>
    </div>
    <div class="qr-success-text" id="qrSuccess">✅ 连接成功！</div>
    <button class="qr-close" onclick="closeQrModal()">关闭</button>
  </div>
</div>

<script>
// ── State ──
let token = localStorage.getItem('rm_token') || '';
let authMode = 'login';
let isLoading = false;
let _sse = null;
let _audioCtx = null;

// ── Init ──
if (token) {
  showApp();
} else {
  document.getElementById('authPage').style.display = 'flex';
}

// ── Auth page ──
function resetAuthForm() {
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('authError').textContent = '';
  const btn = document.getElementById('authBtn');
  btn.disabled = false;
  btn.textContent = authMode === 'login' ? '登录' : '注册';
}

function switchTab(mode) {
  authMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
  resetAuthForm();
}

async function doAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  const btn = document.getElementById('authBtn');
  if (btn.disabled) return;  // 防重复点击
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = '请填写邮箱和密码'; return; }
  btn.disabled = true;
  btn.textContent = '请稍候...';
  try {
    const resp = await fetch('/api/' + authMode, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await resp.json();
    if (!resp.ok) { errEl.textContent = data.detail || '操作失败'; btn.disabled = false; btn.textContent = authMode === 'login' ? '登录' : '注册'; return; }
    token = data.token;
    localStorage.setItem('rm_token', token);
    showApp();
  } catch (e) {
    errEl.textContent = '网络错误，请重试';
    btn.disabled = false;
    btn.textContent = authMode === 'login' ? '登录' : '注册';
  }
}

function skipAuth() {
  token = 'skip';
  showApp();
}

function logout() {
  if (_sse) { _sse.close(); _sse = null; }
  token = '';
  localStorage.removeItem('rm_token');
  document.getElementById('app').classList.remove('active');
  document.getElementById('authPage').style.display = 'flex';
  resetAuthForm();
  document.getElementById('authEmail').focus();
}

// ── Chat app ──
function showApp() {
  document.getElementById('authPage').style.display = 'none';
  document.getElementById('app').classList.add('active');
  // 清空聊天记录，显示欢迎消息
  document.getElementById('messages').innerHTML =
    '<div class="msg assistant"><div class="msg-avatar">🤖</div><div class="msg-bubble">你好！我是提醒助手 ⏰<br>比如你可以说："明天下午3点提醒我开会"、"10分钟后提醒我看邮件"</div></div>';
  requestNotificationPermission();
  connectSSE();
  loadReminders();
  loadPlatformStatus();
  document.getElementById('userInput').focus();
  window.addEventListener('beforeunload', () => {
    if (_sse) { _sse.close(); _sse = null; }
  });
}

function apiHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (token && token !== 'skip') h['Authorization'] = 'Bearer ' + token;
  return h;
}
function authHeaders() {
  var h = {};
  if (token && token !== 'skip') h['Authorization'] = 'Bearer ' + token;
  return h;
}

function sseTokenParam() {
  return (token && token !== 'skip') ? ('&token=' + token) : '';
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text || isLoading) return;
  input.value = ''; isLoading = true; btn.disabled = true;
  appendMessage('user', text);
  showTyping();
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST', headers: apiHeaders(),
      body: JSON.stringify({ message: text }),
    });
    if (resp.status === 401) { removeTyping(); logout(); return; }
    const data = await resp.json();
    removeTyping();
    appendMessage('assistant', data.reply);
  } catch (e) {
    removeTyping();
    appendMessage('assistant', '抱歉，连接失败，请重试。');
  }
  isLoading = false; btn.disabled = false; input.focus();
  loadReminders();
}

function appendMessage(role, content) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = role === 'user' ? '👤' : role === 'system' ? '' : '🤖';
  const avatarDiv = role === 'system' ? '' : `<div class="msg-avatar">${avatar}</div>`;
  div.innerHTML = `${avatarDiv}<div class="msg-bubble">${esc(content)}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'typing'; div.id = 'typing-indicator';
  div.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
  msgs.appendChild(div); msgs.scrollTop = msgs.scrollHeight;
}
function removeTyping() { const el = document.getElementById('typing-indicator'); if (el) el.remove(); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

// ── SSE ──
function connectSSE() {
  if (_sse) { _sse.close(); _sse = null; }
  if (token === 'skip') return; // 跳过登录时不连 SSE
  const es = new EventSource('/api/sse?token=' + token);
  _sse = es;
  es.onmessage = (e) => {
    if (!e.data) return;
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'notification') {
        playDing();
        appendMessage('system', `⏰ 提醒时间到：${data.task}`);
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('POKEE', { body: data.task, icon: '⏰' });
        }
        loadReminders();
      } else if (data.type === 'platform_connected') {
        // 关闭当前 QR 弹窗并刷新平台状态
        if (_qrPollTimer) {
          clearInterval(_qrPollTimer);
          _qrPollTimer = null;
        }
        closeQrModal();
        loadPlatformStatus();
      }
    } catch (_) {}
  };
  es.onerror = () => { _sse = null; setTimeout(connectSSE, 3000); };
}

// ── Audio ──
function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}
function playDing() {
  try {
    const ctx = getAudioCtx();
    const [gain, osc] = [ctx.createGain(), ctx.createOscillator()];
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
  } catch (_) {}
}
document.addEventListener('click', () => { if (_audioCtx?.state === 'suspended') _audioCtx.resume(); }, {once: true});
document.addEventListener('keydown', () => { if (_audioCtx?.state === 'suspended') _audioCtx.resume(); }, {once: true});

// ── Reminders ──
async function loadReminders() {
  if (token === 'skip') return;
  try {
    const resp = await fetch('/reminders?_=' + Date.now(), { headers: apiHeaders() });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    renderReminderList(await resp.json());
  } catch (e) {
    document.getElementById('reminderList').innerHTML =
      '<div class="empty-state">加载失败</div>';
  }
}
function renderReminderList(reminders) {
  const container = document.getElementById('reminderList');
  if (!reminders || reminders.length === 0) {
    container.innerHTML = '<div class="empty-state">暂无提醒<br>在聊天框中创建一个吧</div>';
    return;
  }
  const pending = reminders.filter(r => r.status === 'pending');
  const done = reminders.filter(r => r.status !== 'pending');
  let html = '';
  if (pending.length > 0) {
    html += `<div class="section-title">⏳ 待触发 (${pending.length})</div>`;
    pending.forEach(r => {
      html += `<div class="reminder-card"><div class="task">${esc(r.task)}</div>
        <div class="meta"><span>🕐 ${fmt(r.run_at)}</span><span>#${r.id}</span></div></div>`;
    });
  }
  if (done.length > 0) {
    html += `<div class="section-title">✅ 已完成 (${done.length})</div>`;
    done.forEach(r => {
      html += `<div class="reminder-card ${r.status}"><div class="task">${esc(r.task)}</div>
        <div class="meta"><span>${r.status==='sent'?'已触发':'已取消'}</span><span>#${r.id}</span></div></div>`;
    });
  }
  container.innerHTML = html;
}
function fmt(iso) {
  if (!iso) return '';
  const d = new Date(iso), p = n => String(n).padStart(2, '0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function resetSession() {
  fetch('/api/reset', { method: 'POST', headers: apiHeaders() });
  document.getElementById('messages').innerHTML = '';
  appendMessage('assistant', '会话已重置，有什么我可以帮你的？');
}

async function loadPlatformStatus() {
  if (token === 'skip') return;
  try {
    const resp = await fetch('/api/platforms/status', { headers: authHeaders() });
    if (!resp.ok) return;
    const platforms = await resp.json();
    const container = document.getElementById('platformList');
    let html = '';
    for (const [key, p] of Object.entries(platforms)) {
      const cls = p.connected ? 'online' : '';
      const hint = p.connected ? (p.how || '') : '点击扫码连接';
      const btnClass = p.has_qr ? ' show' : '';
      html += `<div class="platform-row">
        <span class="platform-dot ${cls}"></span>
        <span class="ps-label">${p.label}</span>
        <span class="ps-hint" style="display:inline">${hint}</span>
        <span class="ps-connect${btnClass}" onclick="event.stopPropagation();showQrModal('${key}')">连接</span>
      </div>`;
    }
    container.innerHTML = html;
  } catch (_) {}
  // 每 30 秒刷新
  setTimeout(loadPlatformStatus, 30000);
}

// ── QR Modal ──
let _qrPollTimer = null;
let _qrLibReady = false;
let _qrLibLoading = false;
let _qrPlatform = '';
let _showingPairingCode = false;

function loadQrLib(cb) {
  if (_qrLibReady) { cb(); return; }
  if (_qrLibLoading) { setTimeout(() => loadQrLib(cb), 200); return; }
  _qrLibLoading = true;
  const s = document.createElement('script');
  s.src = 'https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload = () => { _qrLibReady = true; cb(); };
  s.onerror = () => {
    const s2 = document.createElement('script');
    s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s2.onload = () => { _qrLibReady = true; cb(); };
    s2.onerror = () => { _qrLibReady = true; cb(); };
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
}

function switchWaTab(tab) {
  var tabQr = document.getElementById('waTabQr');
  var tabPairing = document.getElementById('waTabPairing');
  var panelQr = document.getElementById('waPanelQr');
  var panelPairing = document.getElementById('waPanelPairing');
  if (tab === 'pairing') {
    tabQr.classList.remove('active');
    tabPairing.classList.add('active');
    panelQr.classList.remove('active');
    panelPairing.classList.add('active');
  } else {
    tabQr.classList.add('active');
    tabPairing.classList.remove('active');
    panelQr.classList.add('active');
    panelPairing.classList.remove('active');
  }
}

async function showQrModal(platform) {
  const overlay = document.getElementById('qrOverlay');
  const title = document.getElementById('qrTitle');
  const sub = document.getElementById('qrSub');
  const container = document.getElementById('qrContainer');
  const success = document.getElementById('qrSuccess');

  const names = { wechat: '微信', whatsapp: 'WhatsApp', feishu: '飞书' };
  const hints = {
    wechat: '在微信中给 Bot 发消息即可使用',
    whatsapp: '在 WhatsApp 中给自己发消息即可使用',
    feishu: '在飞书中搜索 POKEE 即可对话',
  };
  title.textContent = '连接 ' + (names[platform] || platform);
  success.style.display = 'none';
  container.innerHTML = '<span style="color:var(--text2);font-size:13px">加载中...</span>';
  overlay.classList.add('active');

  if (_qrPollTimer) { clearInterval(_qrPollTimer); _qrPollTimer = null; }
  _qrPlatform = platform;

  // WhatsApp: show tabs; other platforms: hide tabs, show QR panel directly
  var waTabs = document.getElementById('waTabs');
  var waPanelQr = document.getElementById('waPanelQr');
  var waPanelPairing = document.getElementById('waPanelPairing');
  if (platform === 'whatsapp') {
    waTabs.style.display = 'flex';
    switchWaTab('qr');
  } else {
    waTabs.style.display = 'none';
    waPanelQr.style.display = 'block';
    waPanelPairing.style.display = 'none';
  }

  function renderConnected(data) {
    success.style.display = 'block';
    success.textContent = '✅ 已连接';
    container.innerHTML = '';
    sub.textContent = hints[platform] || '';
    if (platform === 'feishu') {
      sub.textContent = hints[platform] || '';
    }
  }

  function renderQr(data) {
    container.innerHTML = '';
    _showingPairingCode = false;
    // WhatsApp pairing code → render in pairing panel, switch tab
    if (data.pairing_code && platform === 'whatsapp') {
      _showingPairingCode = true;
      var pairingDisplay = document.getElementById('pairingCodeDisplay');
      pairingDisplay.innerHTML =
        '<div style="font-size:12px;color:var(--text2);margin-bottom:8px">在 WhatsApp 中输入此配对码</div>' +
        '<div style="font-size:11px;color:var(--text2);margin-bottom:8px">WhatsApp → 设置 → 已关联设备 → 使用电话号码关联</div>' +
        '<div style="font-size:28px;font-weight:700;letter-spacing:4px;color:#fff;padding:16px;background:var(--surface2);border-radius:8px;margin-bottom:12px">' +
        esc(data.pairing_code) + '</div>';
      pairingDisplay.style.display = 'block';
      document.getElementById('pairingInput').style.display = 'none';
      switchWaTab('pairing');
      sub.textContent = '';
      return;
    }
    // Feishu: show QR from device-code flow, or pairing code (legacy global bot)
    if (platform === 'feishu' && data.qr_url && !data.pairing_code) {
      container.innerHTML = '';
      sub.textContent = '请使用飞书 App 扫描二维码创建 Bot';
      loadQrLib(function() {
        try {
          new QRCode(container, {
            text: data.qr_url, width: 220, height: 220,
            colorDark: '#e4e6ed', colorLight: '#1a1d27'
          });
        } catch (_) {
          container.innerHTML = '<span style="color:var(--red);font-size:13px">二维码生成失败，请刷新重试</span>';
        }
      });
      return;
    }
    if (platform === 'feishu' && data.pairing_code) {
      _showingPairingCode = true;
      container.innerHTML = '<div style="text-align:center">' +
        '<div style="font-size:13px;color:var(--text);margin-bottom:8px">将下方配对码发送给机器人即可完成绑定</div>' +
        '<div style="font-size:28px;font-weight:700;letter-spacing:4px;color:#fff;padding:16px;background:var(--surface2);border-radius:8px;margin-bottom:12px">' +
        esc(data.pairing_code) + '</div>' +
        '<div style="font-size:12px;color:var(--text2);line-height:1.6">1. 打开飞书，搜索 <b>POKEE</b><br>2. 将上方配对码发送给机器人<br>3. 页面自动检测连接状态</div>' +
        '</div>';
      sub.textContent = '';
      return;
    }
    if (data.qr_image) {
      var img = document.createElement('img');
      img.src = data.qr_image;
      img.style.width = '220px'; img.style.height = '220px';
      img.onerror = function() { container.innerHTML = '<span style="color:var(--red);font-size:13px">二维码加载失败</span>'; };
      container.appendChild(img);
      if (platform === 'wechat') sub.textContent = '请使用微信扫描二维码';
      else if (platform === 'whatsapp') sub.textContent = '请使用 WhatsApp 扫描二维码（设置 → 已关联设备）';
      return;
    }
    var qrText = data.qr || data.qr_url || data.qr_data || '';
    if (!qrText) { container.innerHTML = '<span style="color:var(--text2);font-size:13px">正在生成二维码...</span>'; return; }
    if (platform === 'wechat' && data.qr_url) {
      sub.textContent = '请使用微信扫描二维码';
    } else if (platform === 'whatsapp') {
      sub.textContent = '请使用 WhatsApp 扫描二维码（设置 → 已关联设备）';
    }
    loadQrLib(function() {
      try { new QRCode(container, { text: qrText, width: 220, height: 220,
        colorDark: '#e4e6ed', colorLight: '#1a1d27' }); } catch (_) {
        container.innerHTML = '<span style="color:var(--red);font-size:13px">二维码生成失败，请刷新重试</span>';
      }
    });
  }

  function startPoll() {
    _qrPollTimer = setInterval(async function() {
      try {
        var r = await fetch('/api/platforms/qr/' + platform, { headers: authHeaders() });
        var d = await r.json();
        if (d.connected) {
          clearInterval(_qrPollTimer); _qrPollTimer = null;
          document.getElementById('pairingInput').style.display = 'none';
          renderConnected(d);
          setTimeout(function() { loadPlatformStatus(); }, 1500);
          return;
        }
        if (d.pairing_code) {
          document.getElementById('pairingInput').style.display = 'none';
          renderQr(d);
          return;
        }
        // Don't overwrite a displayed pairing code with QR
        if (_showingPairingCode) return;
        var hasQrNow = d.qr_image || (platform === 'wechat' && d.qr_url) || d.qr || d.qr_data;
        var showingQr = container.querySelector('img') || container.querySelector('canvas');
        if (hasQrNow && !showingQr) renderQr(d);
      } catch (_) {}
    }, 3000);
  }

  try {
    var resp = await fetch('/api/platforms/qr/' + platform, { headers: authHeaders() });
    var data = await resp.json();

    if (data.connected) { renderConnected(data); return; }

    if (data.error) {
      container.innerHTML = '<span style="color:var(--red);font-size:13px">适配器未启动</span>';
      sub.textContent = '请先启动 adapter 后再试';
      return;
    }

    // WhatsApp: show phone input for pairing code
    if (platform === 'whatsapp') {
      document.getElementById('pairingInput').style.display = 'block';
      document.getElementById('waPhone').value = '';
      document.getElementById('pairingError').textContent = '';
      document.getElementById('pairingBtn').disabled = false;
      document.getElementById('pairingBtn').textContent = '获取配对码';
    } else {
      document.getElementById('pairingInput').style.display = 'none';
    }

    if (platform === 'feishu' && data.qr_url && !data.pairing_code) {
      renderQr(data);
      startPoll();
    } else if (data.pairing_code && platform !== 'feishu') {
      renderQr(data);
    } else if (platform === 'feishu' && data.pairing_code) {
      renderQr(data);
      startPoll();
    } else {
      var hasQr = data.qr_image || data.qr_url || data.qr || data.qr_data;
      if (hasQr) {
        renderQr(data);
        startPoll();
      } else {
        container.innerHTML = '<span style="color:var(--text2);font-size:13px">正在生成二维码...</span>';
        sub.textContent = '请稍后，二维码生成中';
        startPoll();
      }
    }
  } catch (_) {
    container.innerHTML = '<span style="color:var(--red);font-size:13px">请求失败，请确认 adapter 已启动</span>';
    sub.textContent = '';
  }
}

function closeQrModal() {
  if (_qrPollTimer) { clearInterval(_qrPollTimer); _qrPollTimer = null; }
  _qrPlatform = '';
  _showingPairingCode = false;
  document.getElementById('pairingCodeDisplay').style.display = 'none';
  document.getElementById('qrOverlay').classList.remove('active');
  loadPlatformStatus();
}

async function requestPairing() {
  var country = document.getElementById('waCountry').value;
  var phone = document.getElementById('waPhone').value.trim();
  var errEl = document.getElementById('pairingError');
  var btn = document.getElementById('pairingBtn');
  if (!phone) { errEl.textContent = '请输入手机号'; return; }
  if (country === 'other' && !phone.startsWith('+')) {
    errEl.textContent = '请手动输入国家码（如 +8613800138000）';
    return;
  }
  var fullPhone = country === 'other' ? phone.replace(/^\+/, '') : (country + phone);
  btn.disabled = true; btn.textContent = '请求中...'; errEl.textContent = '';
  try {
    var r = await fetch('/api/platforms/qr/whatsapp/pairing', {
      method: 'POST', headers: apiHeaders(),
      body: JSON.stringify({ phone: fullPhone }),
    });
    var d = await r.json();
    if (d.error) { errEl.textContent = d.error; btn.disabled = false; btn.textContent = '获取配对码'; return; }
    if (d.pairing_code) {
      _showingPairingCode = true;
      document.getElementById('pairingInput').style.display = 'none';
      var pairingDisplay = document.getElementById('pairingCodeDisplay');
      pairingDisplay.innerHTML =
        '<div style="font-size:12px;color:var(--text2);margin-bottom:8px">在 WhatsApp 中输入此配对码</div>' +
        '<div style="font-size:11px;color:var(--text2);margin-bottom:8px">WhatsApp → 设置 → 已关联设备 → 使用电话号码关联</div>' +
        '<div style="font-size:28px;font-weight:700;letter-spacing:4px;color:#fff;padding:16px;background:var(--surface2);border-radius:8px;margin-bottom:12px">' +
        esc(d.pairing_code) + '</div>';
      pairingDisplay.style.display = 'block';
    }
  } catch (_) {
    errEl.textContent = '网络错误';
  }
  btn.disabled = false; btn.textContent = '获取配对码';
}

function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}
