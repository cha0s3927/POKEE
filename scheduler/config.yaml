# Reminder Agent 配置
server_url: "${SERVER_URL:-http://localhost:8000}"

database:
  url: "sqlite:///data/reminders.db"

# LLM 配置（DeepSeek API，OpenAI 兼容格式）
llm:
  api_key: "${DEEPSEEK_API_KEY:-}"
  base_url: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}"
  model: "${LLM_MODEL:-deepseek-v4-flash}"

# WeChat 接入
wechat:
  secret: "${WECHAT_SECRET:-wechat-secret-change-me}"

# 飞书接入
feishu:
  app_id: "${FEISHU_APP_ID:-}"
  app_secret: "${FEISHU_APP_SECRET:-}"

# WhatsApp 接入
whatsapp:
  secret: "${WHATSAPP_SECRET:-whatsapp-secret-change-me}"

# LinkedIn 接入
linkedin:
  secret: "${LINKEDIN_SECRET:-reminder-agent-linkedin-2026}"

# V免签（个人收款码 + Android 监控 APK）
vmq:
  key: "${VMQ_KEY:-vmq-key-change-me}"
  host_port: "${VMQ_HOST_PORT:-8.161.228.6}"


