services:
  reminder-agent:
    build:
      context: .
      args:
        - HTTP_PROXY=${BUILD_PROXY:-}
        - HTTPS_PROXY=${BUILD_PROXY:-}
        - NO_PROXY=${NO_PROXY:-127.0.0.1,localhost}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./scheduler/data:/app/data
      - ./whatsapp-adapter/auth_info_baileys:/app/whatsapp-adapter/auth_info_baileys
      - wechat-accounts:/root/.openclaw
    env_file:
      - .env
    environment:
      # LLM
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      # Server
      - SERVER_URL=${SERVER_URL:-http://localhost:8000}
      - API_BASE=http://127.0.0.1:8000
      # Feishu
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      # WeChat adapter
      - WECHAT_SECRET=${WECHAT_SECRET:-wechat-secret-change-me}
      - WECHAT_PUSH_URL=${WECHAT_PUSH_URL:-http://127.0.0.1:8765/push}
      - WECHAT_PUSH_PORT=8765
      # WhatsApp adapter
      - WHATSAPP_SECRET=${WHATSAPP_SECRET:-whatsapp-secret-change-me}
      - WHATSAPP_PUSH_URL=${WHATSAPP_PUSH_URL:-http://127.0.0.1:8767/push}
      - WHATSAPP_PUSH_PORT=8767
      # LinkedIn
      - LINKEDIN_EMAIL=${LINKEDIN_EMAIL:-}
      - LINKEDIN_PASSWORD=${LINKEDIN_PASSWORD:-}
      - LINKEDIN_SECRET=${LINKEDIN_SECRET:-linkedin-secret-change-me}
      - LINKEDIN_LI_AT=${LINKEDIN_LI_AT:-}
      - LINKEDIN_JSESSIONID=${LINKEDIN_JSESSIONID:-}
      # 虎皮椒支付
      - XUNHUPAY_WX_APPID=${XUNHUPAY_WX_APPID:-}
      - XUNHUPAY_WX_APPSECRET=${XUNHUPAY_WX_APPSECRET:-}
      - XUNHUPAY_ALI_APPID=${XUNHUPAY_ALI_APPID:-}
      - XUNHUPAY_ALI_APPSECRET=${XUNHUPAY_ALI_APPSECRET:-}
      # Proxy (optional, set PROXY_URL in .env if needed, e.g. http://host.docker.internal:7897)
      - HTTPS_PROXY=${PROXY_URL:-}
      - HTTP_PROXY=${PROXY_URL:-}
      - NO_PROXY=${NO_PROXY:-127.0.0.1,localhost,host.docker.internal,api.deepseek.com}
    restart: unless-stopped

volumes:
  wechat-accounts:
