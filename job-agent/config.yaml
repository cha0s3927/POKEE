database:
  url: sqlite:///D:/项目研究/reminder-agent/scheduler/data/reminders.db

llm:
  api_key: ${DEEPSEEK_API_KEY}
  base_url: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
  model: ${LLM_MODEL:-deepseek-chat}

server_url: ${SERVER_URL:-http://localhost:8001}

search:
  http_proxy: ${HTTP_PROXY:-}
  serper_api_key: ${SERPER_API_KEY:-}

# 语音识别 (STT): 设为 whisper_api 启用服务端识别，不配则用浏览器自带
stt:
  provider: ${STT_PROVIDER:-web}
  api_key: ${STT_API_KEY:-}
  base_url: ${STT_BASE_URL:-https://api.openai.com/v1}
  model: ${STT_MODEL:-whisper-1}

auth:
  jwt_secret: ${JWT_SECRET:-job-agent-secret-change-me-in-production}
